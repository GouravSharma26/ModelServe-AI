[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelserve-ai"
version = "0.1.0"
description = "Reproducible model training and inference platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "joblib==1.4.2",
  "numpy==2.1.3",
  "pandas==2.3.2",
  "pydantic==2.14.1",
  "scikit-learn==1.5.2",
  "scipy==1.16.2",
  "uvicorn==0.54.0",
]

[project.scripts]
modelserve-train = "modelserve.training:main"
modelserve-api = "modelserve.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
