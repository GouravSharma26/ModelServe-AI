name: ModelServe AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Unit & Persistence Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Dependency check
        run: |
          python -m pip check

      - name: Syntax and byte-compilation check
        run: |
          python -m compileall -q src tests scripts

      - name: Run automated test suite
        run: |
          python -m pytest -ra

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

  container-build-and-integration:
    name: Container Builds & E2E Compose Integration
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build -f Dockerfile.api -t modelserve-api:latest .

      - name: Build Dashboard Docker image
        run: |
          docker build -f Dockerfile.dashboard -t modelserve-dashboard:latest .

      - name: Set up Python 3.12 for model prep and smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Reproducible model preparation from clean checkout
        run: |
          python scripts/prepare_model.py --output artifacts/models

      - name: Start Docker Compose stack
        run: |
          docker compose up -d --build

      - name: Wait for API service readiness
        run: |
          echo "Waiting for API readiness at http://127.0.0.1:8000/health/ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/ready || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 2s..."
            sleep 2
          done
          if [ "$STATUS" -ne 200 ]; then
            echo "API failed to reach readiness. Docker Compose logs:"
            docker compose logs
            exit 1
          fi

      - name: Verify Dashboard health
        run: |
          echo "Waiting for Dashboard health at http://127.0.0.1:8501/_stcore/health..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8501/_stcore/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Dashboard is healthy!"
              break
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 2s..."
            sleep 2
          done
          if [ "$STATUS" -ne 200 ]; then
            echo "Dashboard health check failed. Docker Compose logs:"
            docker compose logs dashboard
            exit 1
          fi

      - name: Run automated smoke test
        run: |
          python scripts/smoke_test.py --url http://127.0.0.1:8000 --dashboard-url http://127.0.0.1:8501

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown Docker Compose stack
        if: always()
        run: |
          docker compose down -v
